<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HomeCave - your local Wine Cellar</title>
  <meta name="description" content="HomeCave - your local Wine Cellar: AI Bottle Label Scanner, SommAI Pairing & Inventory Mobile App" />
  <meta name="theme-color" content="#621322" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HomeCave" />
  <link rel="manifest" href="/homecave/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/homecave/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/homecave/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/homecave/icon-192.png" />
  <style>
    /* Startup splash: inlined so it paints before any other CSS/JS loads. */
    #hc-splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: #ffffff;
      transition: opacity 0.35s ease;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #hc-splash.hide { opacity: 0; pointer-events: none; }
    #hc-splash img {
      width: 176px;
      height: 176px;
      object-fit: contain;
      animation: hc-pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #hc-splash .hc-splash-name {
      font-size: 20px;
      font-weight: 700;
      color: #621322;
      letter-spacing: -0.2px;
      text-align: center;
    }
    #hc-splash .hc-splash-version {
      font-size: 12px;
      font-weight: 600;
      color: #8c7b80;
      margin-top: -6px;
      letter-spacing: 0.3px;
    }
    @keyframes hc-pop { from { transform: scale(0.84); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
  <link rel="stylesheet" href="/homecave/styles.css?v=0.9.4" />
</head>
<body>
  <div id="hc-splash" role="img" aria-label="HomeCave - your local Wine Cellar">
    <img src="/homecave/logo-512.png" alt="HomeCave" />
    <div class="hc-splash-name">HomeCave - your local Wine Cellar</div>
    <div class="hc-splash-version">v0.9.4</div>
  </div>
  <script src="/homecave/splash.js?v=0.9.4"></script>
  <div id="homecave-mobile-root"></div>
  <script src="/homecave/app.js?v=0.9.4"></script>
</body>
</html>
