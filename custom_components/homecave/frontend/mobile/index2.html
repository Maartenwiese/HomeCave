<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HomeCave - your local Wine Cellar</title>
  <meta name="description" content="HomeCave - your local Wine Cellar: Modern AI Bottle Label Scanner, SommAI Pairing & Inventory Mobile App" />
  <meta name="theme-color" content="#121114" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HomeCave" />
  <link rel="manifest" href="/homecave/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/homecave/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/homecave/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/homecave/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* Startup splash: inlined so it paints before any other CSS/JS loads. */
    #hc-splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, rgba(99, 29, 52, 0.4) 0%, rgba(18, 17, 20, 1) 75%);
      background-color: #121114;
      transition: opacity 0.35s ease;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #hc-splash.hide { opacity: 0; pointer-events: none; }
    #hc-splash img {
      width: 176px;
      height: 176px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(99, 29, 52, 0.5));
      animation: hc-pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #hc-splash .hc-splash-name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: #F7F5F0;
      letter-spacing: -0.2px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }
    #hc-splash .hc-splash-version {
      font-size: 11px;
      font-weight: 700;
      color: #D4AF37;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: -6px;
    }
    @keyframes hc-pop { from { transform: scale(0.84); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
  <link rel="stylesheet" href="/homecave/styles2.css?v=0.9.7" />
</head>
<body class="dark-theme">
  <div id="hc-splash" role="img" aria-label="HomeCave - your local Wine Cellar">
    <img src="/homecave/logo-512.png" alt="HomeCave" />
    <div class="hc-splash-name">HomeCave - your local Wine Cellar</div>
    <div class="hc-splash-version">v0.9.7 · Modern Edition</div>
  </div>
  <script src="/homecave/splash.js?v=0.9.7"></script>
  <div id="homecave-mobile-root"></div>
  <script src="/homecave/app2.js?v=0.9.7"></script>
</body>
</html>
