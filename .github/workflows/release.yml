name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release for HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ZIP archive for HACS release
        run: |
          cd "${{ github.workspace }}/custom_components/homecave"
          zip -r "${{ github.workspace }}/homecave.zip" . -x "*.pyc" "__pycache__/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: homecave.zip
          generate_release_notes: true
